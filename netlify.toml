[build]
  publish = "."

[[redirects]]
  from = "/*"
  to = "/restricted/"
  status = 403
  force = true
  conditions = {Country = ["NG", "PK", "RU", "IN"]}

[[redirects]]
  from = "/*"
  to = "/404/index.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
