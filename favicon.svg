<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Background circle -->
  <circle cx="16" cy="16" r="16" fill="#1c2b22"/>

  <!-- Scale of justice - white on dark -->
  <!-- Central pillar -->
  <rect x="15.2" y="7" width="1.6" height="17" fill="white" rx="0.8"/>

  <!-- Top bar -->
  <rect x="8" y="7" width="16" height="2" fill="white" rx="1"/>

  <!-- Left chain -->
  <line x1="9.5" y1="9" x2="6.5" y2="17" stroke="white" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Right chain -->
  <line x1="22.5" y1="9" x2="25.5" y2="17" stroke="white" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Left pan -->
  <path d="M3.5 17 Q6.5 22 9.5 17" fill="none" stroke="white" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Right pan -->
  <path d="M22.5 17 Q25.5 22 28.5 17" fill="none" stroke="white" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Base -->
  <rect x="12" y="23" width="8" height="1.8" fill="white" rx="0.9"/>

  <!-- Brand red accent dot -->
  <circle cx="16" cy="7" r="2.2" fill="#d62828"/>
</svg>
