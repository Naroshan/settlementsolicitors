<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 248 48" width="248" height="48">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&amp;display=swap');</style>
  </defs>

  <!-- Scales of justice icon — matches homepage exactly -->
  <g transform="translate(0, 8)">
    <rect x="14.6" y="0" width="1.6" height="22" rx="0.8" fill="#17211f"/>
    <rect x="6" y="0" width="18" height="2" rx="1" fill="#17211f"/>
    <line x1="7.5" y1="2" x2="4" y2="11" stroke="#17211f" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="22.5" y1="2" x2="26" y2="11" stroke="#17211f" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M1 11 Q4 17 7.5 11" fill="none" stroke="#17211f" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M22.5 11 Q26 17 29 11" fill="none" stroke="#17211f" stroke-width="1.5" stroke-linecap="round"/>
    <rect x="10" y="21" width="10" height="1.8" rx="0.9" fill="#17211f"/>
    <circle cx="15" cy="0" r="2.5" fill="#a05c34"/>
  </g>

  <!-- Wordmark — Settlement.Solicitors on one line matching homepage -->
  <text x="42" y="24" font-family="'Playfair Display', Georgia, serif" font-size="18.5" font-weight="500" fill="#17211f" letter-spacing="-0.2">Settlement</text>
  <text x="142" y="24" font-family="'Playfair Display', Georgia, serif" font-size="18.5" font-weight="500" fill="#a05c34">.</text>
  <text x="149" y="24" font-family="'Playfair Display', Georgia, serif" font-size="18.5" font-weight="500" fill="#17211f" letter-spacing="-0.2">Solicitors</text>

  <!-- Sub-label -->
